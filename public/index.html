<!DOCTYPE html>
<!-- DO NOT EDIT THIS FILE. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema Movie List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Cinema Movie List</h1>
    <p>CA Lab Exam &middot; Section 3MCA06 &middot; Set D</p>
  </header>

  <main>
    <div class="controls">
      <section class="panel">
        <h2>Quick views</h2>
        <div class="actions">
          <button id="show-all" type="button">Show All Movies</button>
          <button id="top-three" type="button">Top 3 Rated Movies</button>
        </div>
      </section>

      <section class="panel">
        <h2>Search by genre</h2>
        <form id="search-form" class="inline">
          <select name="genre" required>
            <option value="">Choose a genre...</option>
            <option value="Sci-Fi">Sci-Fi</option>
            <option value="Drama">Drama</option>
            <option value="Comedy">Comedy</option>
          </select>
          <button type="submit">Search</button>
        </form>
      </section>

      <section class="panel">
        <h2>Filter</h2>
        <form id="filter-form" class="inline">
          <label>Released in or after
            <input type="number" name="fromYear" step="1" required>
          </label>
          <button type="submit">Filter</button>
        </form>
      </section>

      <section class="panel">
        <h2>Add Movie</h2>
        <form id="add-form" class="stack">
        <label>Title
          <input type="text" name="title" required>
        </label>
        <label>Genre
          <select name="genre" required>
            <option value="">Choose...</option>
            <option value="Sci-Fi">Sci-Fi</option>
            <option value="Drama">Drama</option>
            <option value="Comedy">Comedy</option>
          </select>
        </label>
        <label>Year
          <input type="number" name="year" step="1" required>
        </label>
        <label>Rating
          <input type="number" name="rating" step="0.1" required>
        </label>
          <button type="submit">Add Movie</button>
        </form>
        <p id="add-status" class="status"></p>
      </section>
    </div>

    <section class="panel results">
      <h2 id="result-title">Results</h2>
      <div id="result"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
